<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal Calculator - Offline Engineering Toolkit</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-input: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --success: #22c55e;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        html.light {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-input: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        /* Category Bar */
        .category-container {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-container::-webkit-scrollbar {
            display: none;
        }

        .category-scroll {
            display: inline-flex;
            gap: 8px;
        }

        .cat-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
        }

        .cat-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* Main App Layout */
        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 1024px) {
            main {
                grid-template-columns: 1.6fr 1fr;
                padding: 24px;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Calculator Workspace */
        .calc-workspace {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            min-height: 44px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        /* Result Panel */
        .result-panel {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .result-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
        }

        .result-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 26px;
            font-weight: 700;
            word-break: break-all;
            color: var(--text-primary);
        }

        .result-unit {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        /* Keypad Styles */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .key-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }

        .key-btn.operator {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .key-btn.action {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* History Panel */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-item {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .history-item:hover {
            border-color: var(--accent);
        }

        .history-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .history-expr {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-res {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .history-time {
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* Bottom Nav & Dots */
        .nav-footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .dots-container {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            max-width: 50vw;
            scrollbar-width: none;
        }

        .dots-container::-webkit-scrollbar {
            display: none;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            opacity: 0.3;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .dot.active {
            opacity: 1;
            background: var(--accent);
            transform: scale(1.3);
        }

        /* Matrix Inputs */
        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Table Results */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 14px;
        }

        .data-table th, .data-table td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: center;
        }

        .data-table th {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .table-container {
            max-height: 250px;
            overflow-y: auto;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 30px;
            box-br: var(--shadow);
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

        <div class="header-left">
            <div class="logo-icon">Ω</div>
            <div class="header-title">
                <h1>Universal Calculator</h1>

    <script>
        // Safe Expression Parser & Tokenizer
        class SafeParser {
            static tokenize(expr) {
                const regex = /\s*([A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?(?:[eE][-+]?\d+)?|[+\-*/^(),]|\S)\s*/g;
                const tokens = [];
                let match;
                while ((match = regex.exec(expr)) !== null) {
                    if (match[1].trim() !== '') {
                        tokens.push(match[1]);
                    }
                }
                return tokens;
            }

            static parse(expr, variables = {}) {
                const tokens = this.tokenize(expr);
                let current = 0;

                function peek() {
                    return tokens[current];
                }

                function consume(expected) {
                    if (tokens[current] === expected) {
                        current++;
                    } else {
                        throw new Error(`Expected '${expected}' at position ${current}`);
                    }
                }

                function parseExpression() {
                    return parseAdditive();
                }

                function parseAdditive() {
                    let node = parseMultiplicative();
                    while (peek() === '+' || peek() === '-') {
                        const op = peek();
                        current++;
                        node = { type: 'Binary', op, left: node, right: parseMultiplicative() };
                    }
                    return node;
                }

                function parseMultiplicative() {
                    let node = parseExponent();
                    while (peek() === '*' || peek() === '/') {
                        const op = peek();
                        current++;
                        node = { type: 'Binary', op, left: node, right: parseExponent() };
                    }
                    return node;
                }

                function parseExponent() {
                    let node = parseUnary();
                    if (peek() === '^') {
                        current++;
                        node = { type: 'Binary', op: '^', left: node, right: parseExponent() };
                    }
                    return node;
                }

                function parseUnary() {
                    if (peek() === '+') {
                        current++;
                        return parseUnary();
                    }
                    if (peek() === '-') {
                        current++;
                        return { type: 'Unary', op: '-', expr: parseUnary() };
                    }
                    return parsePrimary();
                }

                function parsePrimary() {
                    const token = peek();
                    if (token === undefined) {
                        throw new Error("Unexpected end of expression");
                    }

                    if (token === '(') {
                        current++;
                        const node = parseExpression();
                        consume(')');
                        return node;
                    }

                    if (!isNaN(token)) {
                        current++;
                        return { type: 'Literal', value: parseFloat(token) };
                    }

                    // Identifiers (functions or variables)
                    if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(token)) {
                        current++;
                        if (peek() === '(') {
                            current++; // consume '('
                            const args = [];
                            if (peek() !== ')') {
                                args.push(parseExpression());
                                while (peek() === ',') {
                                    current++;
                                    args.push(parseExpression());
                                }
                            }
                            consume(')');
                            return { type: 'Call', name: token.toLowerCase(), args };
                        } else {
                            return { type: 'Identifier', name: token.toLowerCase() };
                        }
                    }

                    throw new Error(`Unexpected token '${token}'`);
                }

                const ast = parseExpression();
                if (current < tokens.length) {
                    throw new Error("Unexpected trailing tokens");
                }
                return this.evaluateAST(ast, variables);
            }

            static evaluateAST(node, vars) {
                switch (node.type) {
                    case 'Literal':
                        return node.value;
                    case 'Identifier':
                        const name = node.name;
                        if (name === 'pi') return Math.PI;
                        if (name === 'e') return Math.E;
                        if (name in vars) return vars[name];
                        throw new Error(`Unknown variable or constant '${name}'`);
                    case 'Unary':
                        const val = this.evaluateAST(node.expr, vars);
                        if (node.op === '-') return -val;
                        return val;
                    case 'Binary':
                        const left = this.evaluateAST(node.left, vars);
                        const right = this.evaluateAST(node.right, vars);
                        switch (node.op) {
                            case '+': return left + right;
                            case '-': return left - right;
                            case '*': return left * right;
                            case '/': 
                                if (right === 0) throw new Error("Division by zero");
                                return left / right;
                            case '^': return Math.pow(left, right);
                        }
                        break;
                    case 'Call':
                        const args = node.args.map(arg => this.evaluateAST(arg, vars));
                        const fn = node.name;
                        switch (fn) {
                            case 'sqrt':
                                if (args[0] < 0) throw new Error("Square root of negative number");
                                return Math.sqrt(args[0]);
                            case 'sin': return Math.sin(args[0]);
                            case 'cos': return Math.cos(args[0]);
                            case 'tan': return Math.tan(args[0]);
                            case 'asin': return Math.asin(args[0]);
                            case 'acos': return Math.acos(args[0]);
                            case 'atan': return Math.atan(args[0]);
                            case 'log': 
                                if (args[0] <= 0) throw new Error("Logarithm domain error");
                                return Math.log10(args[0]);
                            case 'ln': 
                                if (args[0] <= 0) throw new Error("Natural log domain error");
                                return Math.log(args[0]);
                            case 'abs': return Math.abs(args[0]);
                            case 'exp': return Math.exp(args[0]);
                            case 'pow': return Math.pow(args[0], args[1]);
                            case 'floor': return Math.floor(args[0]);
                            case 'ceil': return Math.ceil(args[0]);
                            case 'round': return Math.round(args[0]);
                            case 'min': return Math.min(...args);
                            case 'max': return Math.max(...args);
                            default:
                                throw new Error(`Unknown function '${fn}'`);
                        }
                }
                throw new Error("Evaluation error");
            }
        }
    </script>

    <script>
        // App State & History
        let currentCategoryIndex = 0;
        let lastResult = 0;
        let historyData = [];

        try {
            const saved = localStorage.getItem('univ_calc_history');
            if (saved) historyData = JSON.parse(saved);
        } catch (e) {
            historyData = [];
        }

        function saveHistory(expr, res) {
            const now = new Date();
            const timeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            historyData.unshift({ expr, res, time: timeStr });
            if (historyData.length > 30) historyData.pop();
            try {
                localStorage.setItem('univ_calc_history', JSON.stringify(historyData));
            } catch (e) {}
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast("Copied to clipboard!"));
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast("Copied to clipboard!");
                }
            } catch (e) {
                showToast("Failed to copy");
            }
        }

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                try { localStorage.setItem('univ_calc_theme', 'light'); } catch (e) {}
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                try { localStorage.setItem('univ_calc_theme', 'dark'); } catch (e) {}
            }
        });

        try {
            const savedTheme = localStorage.getItem('univ_calc_theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }
        } catch(e) {}
    </script>

    <script>
        // General Calculator Logic
        function genAppend(val) {
            const inp = document.getElementById('gen-expr');
            if (!inp) return;
            inp.value += val;
            inp.focus();
        }
        function genClear() {
            const inp = document.getElementById('gen-expr');
            if (inp) inp.value = '';
        }
        function genBackspace() {
            const inp = document.getElementById('gen-expr');
            if (inp) inp.value = inp.value.slice(0, -1);
        }
        function genUsePrev() {
            const inp = document.getElementById('gen-expr');
            if (inp) inp.value += lastResult;
        }
        function calculateGeneral() {
            const expr = document.getElementById('gen-expr').value;
            const xVal = parseFloat(document.getElementById('gen-x').value) || 0;
            const resEl = document.getElementById('gen-result');
            const unitEl = document.getElementById('gen-unit');
            try {
                const res = SafeParser.parse(expr, { x: xVal });
                if (isNaN(res) || !isFinite(res)) throw new Error("Invalid result");
                lastResult = res;
                resEl.textContent = res;
                unitEl.textContent = "Evaluated successfully";
                saveHistory(expr, res);
            } catch (err) {
                resEl.textContent = "Error";
                unitEl.textContent = err.message;
            }
        }

        // Calculus Logic
        function calculateCalculus() {
            const fStr = document.getElementById('calc-f').value;
            const x = parseFloat(document.getElementById('calc-x').value) || 0;
            const dx = parseFloat(document.getElementById('calc-dx').value) || 0.0001;
            const n = parseInt(document.getElementById('calc-n').value) || 100;
            const end = parseFloat(document.getElementById('calc-dx').value) || 5; // using dx input as end for integral if needed, or separate
            
            const derivEl = document.getElementById('calc-res-deriv');
            const integEl = document.getElementById('calc-res-integ');

            try {
                // Derivative via Central Difference
                const fPlus = SafeParser.parse(fStr, { x: x + dx });
                const fMinus = SafeParser.parse(fStr, { x: x - dx });
                const deriv = (fPlus - fMinus) / (2 * dx);

                // Integral via Simpson's Rule on [x, end]
                const a = x;
                const b = end > x ? end : x + 5;
                const intervals = n % 2 === 0 ? n : n + 1;
                const h = (b - a) / intervals;
                let sum = SafeParser.parse(fStr, { x: a }) + SafeParser.parse(fStr, { x: b });

                for (let i = 1; i < intervals; i++) {
                    const xi = a + i * h;
                    const fi = SafeParser.parse(fStr, { x: xi });
                    sum += fi * (i % 2 === 0 ? 2 : 4);
                }
                const integ = (h / 3) * sum;

                derivEl.textContent = `f'(${x}) ≈ ${deriv.toFixed(6)}`;
                integEl.textContent = `∫[${a}, ${b}] f(x)dx ≈ ${integ.toFixed(6)}`;
                lastResult = deriv;
                saveHistory(`d/dx(${fStr}) at x=${x}`, deriv);
            } catch (err) {
                derivEl.textContent = "Derivative Error";
                integEl.textContent = err.message;
            }
        }

        // Statistics Logic
        function calculateStatistics() {
            const raw = document.getElementById('stat-data').value;
            const container = document.getElementById('stat-results');
            try {
                const arr = raw.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
                if (arr.length === 0) throw new Error("No valid numbers");
                const n = arr.length;
                const sum = arr.reduce((a, b) => a + b, 0);
                const mean = sum / n;
                const sorted = [...arr].sort((a, b) => a - b);
                const median = n % 2 === 0 ? (sorted[n/2 - 1] + sorted[n/2]) / 2 : sorted[Math.floor(n/2)];
                const min = sorted[0];
                const max = sorted[n - 1];

                const popVar = arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n;
                const popStd = Math.sqrt(popVar);
                const sampVar = n > 1 ? arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1) : 0;
                const sampStd = Math.sqrt(sampVar);

                container.innerHTML = `
                    <div>n: ${n}</div><div>Sum: ${sum.toFixed(4)}</div>
                    <div>Mean: ${mean.toFixed(4)}</div><div>Median: ${median.toFixed(4)}</div>
                    <div>Min: ${min}</div><div>Max: ${max}</div>
                    <div>Pop Std: ${popStd.toFixed(4)}</div><div>Samp Std: ${sampStd.toFixed(4)}</div>
                `;
                lastResult = mean;
                saveHistory(`Stats (${n} items)`, mean);
            } catch (err) {
                container.innerHTML = `<div style="color:var(--danger)">Error: ${err.message}</div>`;
            }
        }

                    if (r <= 0 || h <= 0) throw new Error("Dimensions must be > 0");
                    const sa = 2 * Math.PI * r * h + 2 * Math.PI * r * r;

                    r1.textContent = `Surface Area: ${sa.toFixed(4)}`;

        // Materials Logic
        function calculateMaterials() {
            const f = parseFloat(document.getElementById('mat-f').value) * parseFloat(document.getElementById('mat-f-unit').value);
            const a = parseFloat(document.getElementById('mat-a').value) * parseFloat(document.getElementById('mat-a-unit').value);
            const dl = parseFloat(document.getElementById('mat-dl').value);
            const l0 = parseFloat(document.getElementById('mat-l0').value);

            const sEl = document.getElementById('mat-res-stress');
            const strainEl = document.getElementById('mat-res-strain');
            const modEl = document.getElementById('mat-res-mod');

            try {
                if (a === 0 || l0 === 0) throw new Error("Invalid geometry");
                const stress = f / a; // Pascals
                const strain = dl / l0;
                if (strain === 0) throw new Error("Strain cannot be zero");
                const modulus = stress / strain;

                function formatPascal(val) {
                    if (val >= 1e9) return (val / 1e9).toFixed(3) + ' GPa';
                    if (val >= 1e6) return (val / 1e6).toFixed(3) + ' MPa';
                    if (val >= 1e3) return (val / 1e3).toFixed(3) + ' kPa';
                    return val.toFixed(2) + ' Pa';
                }

                sEl.textContent = `Stress: ${formatPascal(stress)}`;
                strainEl.textContent = `Strain: ${strain.toExponential(4)}`;
                modEl.textContent = `Young's Modulus (E): ${formatPascal(modulus)}`;
                lastResult = stress;
                saveHistory(`Materials Stress`, formatPascal(stress));
            } catch (err) {
                sEl.textContent = "Error";
                strainEl.textContent = err.message;
                modEl.textContent = "";
            }
        }

            const mode = document.getElementById('pend-mode').value;
            const r1 = document.getElementById('pend-res-primary');

            try {
                let T = 0, L = 0, g = 9.80665;

                    L = parseFloat(document.getElementById('pend-l').value);
                    g = parseFloat(document.getElementById('pend-g').value);
                    if (L <= 0 || g <= 0) throw new Error("Values must be > 0");
                    T = 2 * Math.PI * Math.sqrt(L / g);
                    r1.textContent = `Period (T): ${T.toFixed(4)} s`;
                } else if (mode === 'L') {
                    T = parseFloat(document.getElementById('pend-t').value);
                    g = parseFloat(document.getElementById('pend-g').value);

                    L = g * Math.pow(T / (2 * Math.PI), 2);
                    r1.textContent = `Length (L): ${L.toFixed(4)} m`;
                } else if (mode === 'g') {
                    T = parseFloat(document.getElementById('pend-t').value);
                    L = parseFloat(document.getElementById('pend-l').value);

                    g = L * Math.pow(2 * Math.PI / T, 2);
                    r1.textContent = `Gravity (g): ${g.toFixed(4)} m/s²`;
                }
                const freq = 1 / T;
                const rpm = (60 / T);
                r2.textContent = `Frequency: ${freq.toFixed(4)} Hz | RPM: ${rpm.toFixed(2)}`;
                lastResult = T;
                saveHistory(`Pendulum (${mode})`, `${T.toFixed(4)} s`);

                r1.textContent = "Error";
                r2.textContent = err.message;
            }

        // Number Base Logic
        function calculateNumberBase(source) {
            const decInp = document.getElementById('nb-dec');
            const binInp = document.getElementById('nb-bin');
            const hexInp = document.getElementById('nb-hex');
            const octInp = document.getElementById('nb-oct');
            const statusEl = document.getElementById('nb-status');

            try {
                let decVal = 0;
                if (source === 'dec') {
                    decVal = parseInt(decInp.value, 10);
                } else if (source === 'bin') {
                    decVal = parseInt(binInp.value, 2);
                } else if (source === 'hex') {
                    decVal = parseInt(hexInp.value, 16);
                } else if (source === 'oct') {
                    decVal = parseInt(octInp.value, 8);
                }

                if (isNaN(decVal)) throw new Error("Invalid number for base");

                if (source !== 'dec') decInp.value = decVal.toString(10);
                if (source !== 'bin') binInp.value = decVal.toString(2);
                if (source !== 'hex') hexInp.value = decVal.toString(16).toUpperCase();
                if (source !== 'oct') octInp.value = decVal.toString(8);

                statusEl.textContent = `Decimal: ${decVal}`;
                lastResult = decVal;
            } catch (err) {
                statusEl.textContent = "Invalid Base Input";
            }
        }

        // Equation & Bisection Solver Logic
        function calculateEquation() {
            const fStr = document.getElementById('eq-f').value;
            const start = parseFloat(document.getElementById('eq-start').value);
            const end = parseFloat(document.getElementById('eq-end').value);
            const step = parseFloat(document.getElementById('eq-step').value);
            const rootEl = document.getElementById('eq-root');
            const tbody = document.getElementById('eq-tbody');

            try {
                // Table Generation
                let html = '';
                for (let x = start; x <= end + 1e-9; x += step) {
                    const fx = SafeParser.parse(fStr, { x: parseFloat(x.toFixed(4)) });
                    html += `<tr><td>${x.toFixed(2)}</td><td>${fx.toFixed(4)}</td></tr>`;
                }
                tbody.innerHTML = html;

                // Bisection Root Finding
                let a = start, b = end;
                let fa = SafeParser.parse(fStr, { x: a });
                let fb = SafeParser.parse(fStr, { x: b });

                if (fa * fb > 0) {
                    rootEl.textContent = "No sign change in interval [a, b]";
                    return;
                }

                let c = a;
                for (let i = 0; i < 100; i++) {
                    c = (a + b) / 2;
                    let fc = SafeParser.parse(fStr, { x: c });
                    if (Math.abs(fc) < 1e-7 || (b - a) / 2 < 1e-7) break;
                    if (fa * fc < 0) {
                        b = c; fb = fc;
                    } else {
                        a = c; fa = fc;
                    }
                }
                rootEl.textContent = `Root x ≈ ${c.toFixed(6)}`;
                lastResult = c;
                saveHistory(`Equation Root (${fStr})`, c.toFixed(4));
            } catch (err) {
                rootEl.textContent = err.message;
                tbody.innerHTML = `<tr><td colspan="2">Error in evaluation</td></tr>`;
            }
        }
    </script>

    <script>
        // Core Navigation & Rendering Engine
        function renderCategoryBar() {
            const bar = document.getElementById('category-bar');
            bar.innerHTML = calculators.map((c, i) => `
                <button class="cat-btn ${i === currentCategoryIndex ? 'active' : ''}" onclick="switchCategory(${i})">
                    <span>${c.icon}</span> ${c.name}
                </button>
            `).join('');

            const dots = document.getElementById('dots-container');
            dots.innerHTML = calculators.map((_, i) => `
                <div class="dot ${i === currentCategoryIndex ? 'active' : ''}" onclick="switchCategory(${i})"></div>
            `).join('');
        }

        function renderActiveCalculator() {
            const main = document.getElementById('app-main');
            const calc = calculators[currentCategoryIndex];
            
            // In desktop two-column view, include the history panel on the right
            main.innerHTML = `
                <div class="calc-pane">
                    ${calc.render()}
                </div>
                <div class="card history-pane">
                    <div class="card-title">
                        Calculation History
                        <button class="btn-secondary" style="padding:4px 10px; font-size:12px; border-radius:6px;" onclick="clearHistory()">Clear</button>
                    </div>
                    <div class="history-list" id="history-list-container">
                        ${renderHistoryList()}
                    </div>
                </div>
            `;
            calc.init();
            renderCategoryBar();
        }

        function renderHistoryList() {
            if (historyData.length === 0) return `<div style="color:var(--text-secondary); text-align:center; padding:20px;">No calculations yet</div>`;
            return historyData.map((item, idx) => `
                <div class="history-item">
                    <div class="history-content">
                        <span class="history-expr">${item.expr}</span>
                        <span class="history-res">${item.res}</span>
                        <span class="history-time">${item.time}</span>
                    </div>
                    <button class="btn-secondary" style="padding:6px 10px; font-size:12px; border-radius:6px;" onclick="copyToClipboard('${item.res}')">Copy</button>
                </div>
            `).join('');
        }

        function clearHistory() {
            historyData = [];
            try { localStorage.removeItem('univ_calc_history'); } catch (e) {}
            renderActiveCalculator();
            showToast("History cleared");
        }

        function switchCategory(index) {
            if (index < 0 || index >= calculators.length) return;
            currentCategoryIndex = index;
            renderActiveCalculator();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('prev-cat-btn').addEventListener('click', () => {
            let nextIdx = currentCategoryIndex - 1;
            if (nextIdx < 0) nextIdx = calculators.length - 1;
            switchCategory(nextIdx);
        });

        document.getElementById('next-cat-btn').addEventListener('click', () => {
            let nextIdx = currentCategoryIndex + 1;
            if (nextIdx >= calculators.length) nextIdx = 0;
            switchCategory(nextIdx);
        });

        // Touch Swipe Handling
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('input, textarea, select, button')) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.target.closest('input, textarea, select, button')) return;
            if (!touchStartX || !touchStartY) return;
            
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.25) {
                if (dx > 0) {
                    // Swipe right -> previous category
                    let nextIdx = currentCategoryIndex - 1;
                    if (nextIdx < 0) nextIdx = calculators.length - 1;
                    switchCategory(nextIdx);
                } else {
                    // Swipe left -> next category
                    let nextIdx = currentCategoryIndex + 1;
                    if (nextIdx >= calculators.length) nextIdx = 0;
                    switchCategory(nextIdx);
                }
            }
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        // Settings Modal event
        document.getElementById('settings-btn').addEventListener('click', () => {
            showToast("Universal Calculator v2.6 • 100% Offline Ready");
        });

        // Initial Launch
        window.onload = function() {
            renderActiveCalculator();
        };
    </script>
</body>
</html>
